name: Generate Snake Animation

on:
  # Atualiza a animação diariamente.
  schedule:
    - cron: "0 0 * * *"
  # Permite executar manualmente pela aba Actions.
  workflow_dispatch:
  # Gera a primeira versão quando houver alterações na branch principal.
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RenanScavazzini
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23bd765f&color_dots=%23fff1e8,%23f4cdbd,%23e6a477,%23d98a75,%23bd765f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23e6a477

      - name: Publish snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
